<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="wrapper">
        <form id="loginForm">
            <h1>Login</h1>

            <div class="input-box">
                <input type="text" id="username" placeholder="e.g., LJ Mendana" required>
                <label for="username">Username</label>
                <i class='bx bxs-user'></i>
            </div>

            <div class="input-box">
                <input type="password" id="password" placeholder="e.g., password1_" required>
                <label for="password">Password</label>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="rememberme">
                <label><input type="checkbox"> Remember me</label>
            </div>

            <button type="submit" class="btn">Log in</button>

            <div class="forgotpass">
                <label for="forgotpass">Forgot Password?</label>
            </div>

            <div class="sign-up">
                <p>Don't have an account? <a href="#">Sign Up</a></p>
            </div>
        </form>
    </div>

  <div class="popup" id="successPopup">
    <div class="popup-content">
      <img src="clap.gif"> 
      <h2>🎉 Congratulations!</h2>
      <p>You've successfully logged in.Yeheyy!!!🥳</p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("successPopup").style.display = "flex";
      setTimeout(() => {
        document.getElementById("successPopup").style.display = "none";
      }, 3000);
    });
  </script>
</body>
</html>
